[project]
name = "aivo"
version = "0.1.0"
description = "Local Japanese voice assistant"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "numpy>=1.26,<3", "faster-whisper>=1.1,<2", "silero-vad>=6,<7", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]
